name: update-index

on:
  push:
    paths:
      - "posts/*.md"
      - "scripts/build_index.py"
      - "scripts/render_posts.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_index.py
      - run: python scripts/render_posts.py
      - name: Commit index and rendered posts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add posts/post.json posts/html
          git diff --cached --quiet || (git commit -m "Auto update post index and rendered posts" && git push)
