<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 | 拾光集</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .md-error { color: var(--muted); }
    .katex-display { margin: 1.4rem 0; overflow-x: auto; padding: 0.3rem 0; }
    article h2 { margin-top: 2.6rem; }
    article h3 { margin-top: 2.2rem; }
    article h4 { margin-top: 1.6rem; }
    article ul, article ol { margin: 0.6rem 0; }
    article li { margin-bottom: 0.5rem; }
    article hr { margin: 2.4rem 0; border: none; border-top: 1px solid var(--border); }
    article pre { background: #f6f5f2; border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.3rem; overflow-x: auto; margin: 1.2rem 0; }
    article pre code { background: none; border: none; padding: 0; font-size: 1rem; line-height: 1.7; }
    article table { border-collapse: collapse; margin: 1.2rem 0; width: 100%; font-size: 0.95rem; }
    article th, article td { border: 1px solid var(--border); padding: 0.5rem 0.8rem; text-align: left; }
    article th { background: var(--paper); }
    article blockquote { margin: 1rem 0; padding: 0.2rem 1.2rem; border-left: 3px solid var(--accent); color: var(--muted); }
    article img { display: block; max-width: 55%; max-height: 480px; width: auto; height: auto; margin: 1.5rem auto; border-radius: 10px; }
    article [id] { scroll-margin-top: 90px; }
    .layout { max-width: 720px; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; }
    .toc { display: none; }
    @media (min-width: 1200px) {
      .layout {
        max-width: 1020px;
        display: grid;
        grid-template-columns: minmax(0, 720px) 230px;
        gap: 2.5rem;
        align-items: start;
      }
      .toc {
        display: block;
        position: sticky;
        top: 90px;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        border-left: 2px solid var(--border);
        padding-left: 1rem;
        font-size: 0.85rem;
      }
      .toc-title { font-weight: 700; font-family: "Noto Serif SC", serif; margin-bottom: 0.6rem; }
      .toc a { display: block; color: var(--muted); text-decoration: none; padding: 0.15rem 0; line-height: 1.5; }
      .toc a:hover { color: var(--accent); }
      .toc a.toc-h3 { padding-left: 1rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="../index.html">拾光集</a>
      <div class="nav-links">
        <a href="../index.html"><span class="zh">首页</span><span class="en">Home</span></a>
        <a href="../reviews.html"><span class="zh">日周月总结</span><span class="en">Reviews</span></a>
        <a href="../notes.html"><span class="zh">学习笔记与感悟</span><span class="en">Notes</span></a>
        <a href="../library.html"><span class="zh">图书馆</span><span class="en">Library</span></a>
        <a href="../about.html"><span class="zh">关于</span><span class="en">About</span></a>
      </div>
    </nav>
  </header>

  <main>
    <div class="layout">
      <article class="md-body" id="content">
        <p class="md-error">正在加载文章…</p>
      </article>
      <nav class="toc" id="toc"></nav>
    </div>
    <div style="max-width:720px; margin:0 auto; padding:0 1.5rem;">
      <a class="back" href="javascript:history.back()">← 返回</a>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 拾光集 · Powered by GitHub Pages</p>
  </footer>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.3/lib/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var file = params.get("md");
      var box = document.getElementById("content");
      var toc = document.getElementById("toc");
      if (!file) {
        box.innerHTML = '<p class="md-error">没有指定文章。链接格式：post.html?md=文件名.md</p>';
        return;
      }
      if (window.markedKatex) {
        marked.use(markedKatex({ throwOnError: false }));
      }

      function finish(meta) {
        var title = meta.title || "文章";
        document.title = title + " | 拾光集";
        var heading = document.createElement("h1");
        heading.textContent = title;
        box.prepend(heading);
        if (window.renderMathInElement) {
          renderMathInElement(box, {
            delimiters: [
              {left: "\\(", right: "\\)", display: false},
              {left: "\\[", right: "\\]", display: true},
              {left: "$$", right: "$$", display: true},
              {left: "$", right: "$", display: false}
            ],
            throwOnError: false
          });
        }
        var headings = box.querySelectorAll("h2, h3");
        if (headings.length >= 2) {
          var html = '<div class="toc-title">目录</div>';
          headings.forEach(function (h, idx) {
            var id = "sec-" + idx;
            h.id = id;
            html += '<a class="toc-' + h.tagName.toLowerCase() + '" href="#' + id + '">' +
                    h.textContent + '</a>';
          });
          toc.innerHTML = html;
          toc.style.display = "";
        }
      }

      function renderMarkdownFallback() {
        fetch(file)
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(function (text) {
            var meta = {};
            var metaMatch = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
            if (metaMatch) {
              metaMatch[1].split("\n").forEach(function (line) {
                var i = line.indexOf(":");
                if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
              });
              text = text.slice(metaMatch[0].length);
            }
            box.innerHTML = marked.parse(text);
            finish(meta);
          })
          .catch(function (err) {
            box.innerHTML = '<p class="md-error">文章加载失败：' + err.message + '。</p>';
          });
      }

      var metaPromise = fetch("posts/post.json")
        .then(function (r) { return r.json(); })
        .then(function (posts) {
          for (var i = 0; i < posts.length; i++)
            if (posts[i].file === file) return posts[i];
          return {};
        })
        .catch(function () { return {}; });

      fetch("posts/html/" + file.replace(/\.md$/, ".html"))
        .then(function (res) {
          if (!res.ok) throw new Error("no prerendered html");
          return res.text();
        })
        .then(function (html) {
          return metaPromise.then(function (meta) {
            box.innerHTML = html;
            finish(meta);
          });
        })
        .catch(renderMarkdownFallback);
    })();
  </script>
</body>
</html>
