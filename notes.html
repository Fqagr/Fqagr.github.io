  <script>
    fetch("posts/post.json")
      .then(r => r.json())
      .then(posts => {

          .filter(p => p.category === "notes")
          .map(p => `
            <a class="post-item" href="posts/post.html?md=${p.file}">
              <span class="date">${p.date}</span>
              <h3>${p.title}</h3>
              <span class="arrow">→</span>

      });
